server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${FILALIVRE_COOKIE_SECURE:false}
        same-site: ${FILALIVRE_COOKIE_SAME_SITE:Lax}

spring:
  application:
    name: filalivre
  mail:
    host: ${FILALIVRE_SMTP_HOST:smtp.gmail.com}
    port: ${FILALIVRE_SMTP_PORT:587}
    username: ${FILALIVRE_SMTP_USERNAME:}
    password: ${FILALIVRE_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    url: jdbc:sqlite:${FILALIVRE_DB_PATH:../database/filalivre.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  web:
    resources:
      static-locations: classpath:/static/, file:${FILALIVRE_FRONTEND_PATH:../frontend}/
  mvc:
    throw-exception-if-no-handler-found: true

filalivre:
  versao: 1.0.0
  cors:
    allowed-origins: ${FILALIVRE_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
  dados-iniciais:
    demo: ${FILALIVRE_DEMO_DATA:false}
  admin:
    email: ${FILALIVRE_ADMIN_EMAIL:}
    password: ${FILALIVRE_ADMIN_PASSWORD:}
  email:
    frontend-url: ${FILALIVRE_FRONTEND_URL:http://localhost:8080/index.html}
