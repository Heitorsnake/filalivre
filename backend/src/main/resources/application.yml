server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${FILALIVRE_COOKIE_SECURE:false}
        same-site: ${FILALIVRE_COOKIE_SAME_SITE:Lax}

spring:
  application:
    name: filalivre
  datasource:
    url: jdbc:sqlite:${FILALIVRE_DB_PATH:../database/filalivre.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  web:
    resources:
      static-locations: classpath:/static/, file:${FILALIVRE_FRONTEND_PATH:../frontend}/
  mvc:
    throw-exception-if-no-handler-found: true

filalivre:
  versao: 1.0.0
  cors:
    allowed-origins: ${FILALIVRE_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
  dados-iniciais:
    demo: ${FILALIVRE_DEMO_DATA:false}
  admin:
    email: ${FILALIVRE_ADMIN_EMAIL:}
    password: ${FILALIVRE_ADMIN_PASSWORD:}
