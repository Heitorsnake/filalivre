<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilaLivre — Acesso</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-corpo">
    <div class="login-marca">
      <div class="logo">FILA<span>LIVRE</span></div>
      <p>Sistema de gerenciamento remoto de caixas de supermercado.
         Solicitações de cancelamento analisadas pelo supervisor sem deslocamento físico.</p>
    </div>

    <div class="abas">
      <button class="aba ativa" id="aba-login">Entrar</button>
      <button class="aba" id="aba-cadastro">Criar conta</button>
    </div>

    <div class="cartao form-cartao">
      <div class="mensagem-erro" id="erro"></div>
      <div class="mensagem-sucesso" id="sucesso"></div>
      <form id="form-login" class="ativo">
        <div class="campo">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" required autocomplete="email" placeholder="voce@filalivre.com">
        </div>
        <div class="campo">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-verde" style="width:100%">Entrar</button>
        <button type="button" class="btn btn-cinza" id="btn-reenviar-verificacao" style="width:100%;margin-top:.6rem">Reenviar código de confirmação Gmail</button>
      </form>

      <form id="form-cadastro">
        <div class="campo">
          <label for="cad-nome">Nome completo</label>
          <input type="text" id="cad-nome" required maxlength="100" autocomplete="name" placeholder="Seu nome">
        </div>
        <div class="campo">
          <label for="cad-email">E-mail</label>
          <input type="email" id="cad-email" required maxlength="254" autocomplete="email" placeholder="voce@filalivre.com">
        </div>
        <div class="campo">
          <label for="cad-senha">Senha (mínimo 12 caracteres)</label>
          <input type="password" id="cad-senha" required minlength="12" maxlength="72" autocomplete="new-password" placeholder="••••••••••••">
        </div>
        <div class="campo">
          <label for="cad-perfil">Tipo de conta</label>
          <select id="cad-perfil" required>
            <option value="OPERADOR">Operador de caixa</option>
            <option value="SUPERVISOR">Supervisor / gestor do mercado</option>
          </select>
        </div>
        <button type="submit" class="btn btn-azul" style="width:100%">Criar conta</button>
      </form>

      <form id="form-verificacao">
        <p id="texto-verificacao">Enviamos um código de 6 dígitos para seu Gmail. Ele expira em 10 minutos.</p>
        <div class="campo">
          <label for="codigo-verificacao">Código de verificação</label>
          <input type="text" id="codigo-verificacao" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="000000">
        </div>
        <button type="submit" class="btn btn-verde" style="width:100%">Verificar e-mail</button>
        <button type="button" class="btn btn-cinza" id="btn-reenviar-codigo" style="width:100%;margin-top:.6rem">Reenviar código</button>
      </form>
    </div>

  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
