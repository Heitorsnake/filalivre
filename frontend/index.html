<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilaLivre — Acesso</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-corpo">
    <div class="idioma-controle" role="group" aria-label="Idioma">
      <button type="button" class="idioma-opcao ativa" data-idioma="pt-BR" aria-label="Português" aria-pressed="true" title="Português">🇧🇷</button>
      <button type="button" class="idioma-opcao" data-idioma="es" aria-label="Español" aria-pressed="false" title="Español">🇪🇸</button>
    </div>
    <div class="login-marca">
      <div class="logo">FILA<span>LIVRE</span></div>
      <p data-i18n="descricao">Sistema de gerenciamento remoto de caixas de supermercado.
         Solicitações de cancelamento analisadas pelo supervisor sem deslocamento físico.</p>
    </div>

    <div class="abas">
      <button class="aba ativa" id="aba-login" data-i18n="abaLogin">Entrar</button>
      <button class="aba" id="aba-cadastro" data-i18n="abaCadastro">Criar conta</button>
    </div>

    <div class="cartao form-cartao">
      <div class="mensagem-erro" id="erro"></div>
      <div class="mensagem-sucesso" id="sucesso"></div>
      <form id="form-login" class="ativo">
        <div class="campo">
          <label for="login-email" data-i18n="email">E-mail</label>
          <input type="email" id="login-email" required autocomplete="email" placeholder="voce@filalivre.com" data-i18n-placeholder="placeholderEmail">
        </div>
        <div class="campo">
          <label for="login-senha" data-i18n="senha">Senha</label>
          <input type="password" id="login-senha" required autocomplete="current-password" placeholder="••••••••" data-i18n-placeholder="placeholderSenha">
        </div>
        <button type="submit" class="btn btn-verde" style="width:100%" data-i18n="entrar">Entrar</button>
      </form>

      <form id="form-cadastro">
        <div class="campo">
          <label for="cad-nome" data-i18n="nomeCompleto">Nome completo</label>
          <input type="text" id="cad-nome" required maxlength="100" autocomplete="name" placeholder="Seu nome" data-i18n-placeholder="placeholderNome">
        </div>
        <div class="campo">
          <label for="cad-email" data-i18n="email">E-mail</label>
          <input type="email" id="cad-email" required maxlength="254" autocomplete="email" placeholder="voce@filalivre.com" data-i18n-placeholder="placeholderEmail">
        </div>
        <div class="campo">
          <label for="cad-senha" data-i18n="senhaCadastro">Senha (mínimo 12 caracteres)</label>
          <input type="password" id="cad-senha" required minlength="12" maxlength="72" autocomplete="new-password" placeholder="••••••••••••" data-i18n-placeholder="placeholderSenha">
        </div>
        <div class="campo">
          <label for="cad-perfil" data-i18n="tipoConta">Tipo de conta</label>
          <select id="cad-perfil" required>
            <option value="OPERADOR" data-i18n="operador">Operador de caixa</option>
            <option value="SUPERVISOR" data-i18n="supervisor">Supervisor / gestor do mercado</option>
          </select>
        </div>
        <button type="submit" class="btn btn-azul" style="width:100%" data-i18n="criarConta">Criar conta</button>
      </form>

    </div>

  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
